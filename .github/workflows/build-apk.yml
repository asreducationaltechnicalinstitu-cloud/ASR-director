name: Build ASR Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -o ASR-Academy-Android-Project.zip -d project
          echo "Project extracted successfully."
          find project -maxdepth 3 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java and Kotlin JVM target to 17
        working-directory: project
        run: |
          echo "Gradle files before fix:"
          find . -name "*.gradle" -type f -print

          cat >> app/build.gradle <<'EOF'

          // CI compatibility: compile Java and Kotlin to the same JVM target.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "Applied Java 17 compileOptions."
          grep -n -A8 -B2 "CI compatibility" app/build.gradle || true

      - name: Build debug APK
        working-directory: project
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show generated APK
        working-directory: project
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Rename APK
        working-directory: project
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ASR-Academy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Academy
          path: project/app/build/outputs/apk/debug/ASR-Academy.apk
          if-no-files-found: error
          
