name: Build ASR Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          unzip -o ASR-Academy-Android-Project.zip -d project
          echo "Project extracted successfully."
          find project -maxdepth 3 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java JVM target
        working-directory: project
        run: |
          echo "Checking Gradle files..."

          find . -name "*.gradle" -type f -print

          echo "Replacing Java 1.8 with Java 17..."

          find . -name "*.gradle" -type f -exec sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = JavaVersion.VERSION_17/g' \
            -e 's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = JavaVersion.VERSION_17/g' \
            {} \;

          echo "Java target fix completed."

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Show generated APK
        working-directory: project
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Academy-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
