name: Build ASR Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -o ASR-Academy-Android-Project.zip -d project
          echo "Project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android source and JVM targets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          # Fix: LaunchedEffect requires at least one key parameter.
          # Replace keyless calls with LaunchedEffect(Unit) { ... }
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/pk/asr/academy/MainActivity.kt")
          text = path.read_text()
          fixed = text.replace("LaunchedEffect {", "LaunchedEffect(Unit) {")
          if fixed == text:
              raise SystemExit("ERROR: Expected keyless LaunchedEffect call was not found")
          path.write_text(fixed)
          print("Fixed LaunchedEffect calls in MainActivity.kt")
          PY

          # Keep Java and Kotlin on same JVM target.
          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build debug APK
        working-directory: project
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Show generated APK
        working-directory: project
        run: find . -type f -name "*.apk" -print

      - name: Rename APK
        working-directory: project
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ASR-Academy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Academy
          path: project/app/build/outputs/apk/debug/ASR-Academy.apk
          if-no-files-found: error
