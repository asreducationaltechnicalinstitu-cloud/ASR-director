name: Build ASR Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project ZIP
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -o ASR-Academy-Android-Project.zip -d project

          echo "Android project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android source and JVM targets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/src/main/java/pk/asr/academy/MainActivity.kt")

          if not path.exists():
              raise SystemExit(
                  "ERROR: MainActivity.kt was not found at: "
                  + str(path)
              )

          text = path.read_text(encoding="utf-8")

          # Fix keyless LaunchedEffect calls.
          #
          # Converts:
          #     LaunchedEffect {
          #
          # into:
          #     LaunchedEffect(Unit) {
          #
          pattern = r'LaunchedEffect\s*\{'

          fixed = re.sub(
              pattern,
              'LaunchedEffect(Unit) {',
              text
          )

          if fixed != text:
              path.write_text(
                  fixed,
                  encoding="utf-8"
              )
              print("Fixed keyless LaunchedEffect calls.")
          else:
              print(
                  "No keyless LaunchedEffect calls found."
              )

          PY

          echo "Configuring Java 17 compatibility..."

          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(
              org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          ).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Java/Kotlin JVM target set to 17."

      - name: Check project files
        working-directory: project
        run: |
          echo "Checking Android project..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "Project files found."

      - name: Build debug APK
        working-directory: project
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        working-directory: project
        run: |
          echo "Searching for generated APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        working-directory: project
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: Debug APK was not generated."
              exit 1
          fi

          cp "$APK" \
             "app/build/outputs/apk/debug/ASR-Academy.apk"

          echo "APK renamed to ASR-Academy.apk"

      - name: Upload ASR Academy APK
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Academy
          path: project/app/build/outputs/apk/debug/ASR-Academy.apk
          if-no-files-found: error
