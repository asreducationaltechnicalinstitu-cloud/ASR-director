name: Build ASR Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -o ASR-Academy-Android-Project.zip -d project

          echo "Android project extracted successfully."
          echo "Project contents:"
          find project -maxdepth 2 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android source and JVM targets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MainActivity.kt..."

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/src/main/java/pk/asr/academy/MainActivity.kt")

          if not path.exists():
              print("ERROR: MainActivity.kt was not found.")
              print("Available Kotlin files:")
              for p in Path("app/src/main").rglob("*.kt"):
                  print(p)
              raise SystemExit(1)

          text = path.read_text(encoding="utf-8")

          print("MainActivity.kt found.")

          # Fix keyless Compose LaunchedEffect:
          #
          # Before:
          # LaunchedEffect {
          #
          # After:
          # LaunchedEffect(Unit) {
          #
          pattern = r'\bLaunchedEffect\s*\{'
          fixed, count = re.subn(
              pattern,
              'LaunchedEffect(Unit) {',
              text
          )

          if count > 0:
              path.write_text(fixed, encoding="utf-8")
              print(f"Fixed {count} keyless LaunchedEffect call(s).")
          else:
              print("No keyless LaunchedEffect calls found.")

          print("Source fix completed.")
          PY

          echo "Applying Java 17 compile compatibility..."

          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "Java 17 compatibility added."

      - name: Show Gradle and project information
        working-directory: project
        shell: bash
        run: |
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -150

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting clean Android build..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        working-directory: project
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: Expected APK was not found:"
              echo "$APK"
              echo ""
              echo "Available APK files:"
              find . -type f -name "*.apk" -print
              exit 1
          fi

          cp "$APK" \
             "app/build/outputs/apk/debug/ASR-Academy.apk"

          echo "APK renamed successfully."

      - name: Upload ASR Academy APK
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Academy
          path: project/app/build/outputs/apk/debug/ASR-Academy.apk
          if-no-files-found: error
